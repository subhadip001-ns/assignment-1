[project]
name = "assignment-1"
version = "0.1.0"
description = "Nustudio101-assignment-1"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120.0",
    "uvicorn>=0.38.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.32.5",
    "email-validator>=2.3.0",
    "pytest>=8.0.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "langchain>=1.0.2",
    "langchain-groq>=1.0.0",
    "langchain-community>=0.3.0",
    "voyageai>=0.2.0",
    "langfuse>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
